<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Halamın İlaçları</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--panel:#ffffff;--panel2:#f9fbff;--text:#16211f;--muted:#657571;--accent:#087b72;--accent2:#0d9488;--pill:#e5f4f2;--warn:#fff5d7;--border:#d8e1df;--grid:#e7eeec;--today:#fff3c2;--shot:#ede9fe;--med:#dcfce7;--pause:#fee2e2;--check:#dbeafe;--shadow:0 14px 34px #23312d18}@media(prefers-color-scheme:dark){:root{--bg:#07110f;--panel:#101d1a;--panel2:#132722;--text:#ecfffb;--muted:#9eb8b2;--accent:#2dd4bf;--accent2:#5eead4;--pill:#153b35;--warn:#3d3217;--border:#294640;--grid:#203b36;--today:#3e3415;--shot:#302645;--med:#173622;--pause:#3c1f24;--check:#182d47;--shadow:0 14px 34px #0005}}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--accent) 12%,var(--bg)));color:var(--text);min-height:100vh}main{max-width:1180px;margin:0 auto;padding:18px 12px 42px}header{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;padding:12px 4px 16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.9rem,5vw,3.7rem);letter-spacing:-.055em}.sub{color:var(--muted);margin-top:5px}.notice{background:var(--warn);border:1px solid var(--border);border-radius:16px;padding:10px 12px;margin:0 0 14px}.toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:22px;padding:10px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:3}.nav,.views,.filters{display:flex;gap:6px;flex-wrap:wrap}.month-title{text-align:center;font-weight:900;font-size:1.15rem;text-transform:capitalize}button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:var(--accent);border-color:var(--accent);color:#fff}.filters{margin:12px 0}.calendar{background:var(--panel);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{padding:10px 8px;color:var(--muted);font-weight:900;text-align:center;border-bottom:1px solid var(--border)}.day{min-height:128px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:8px;background:var(--panel)}.day:nth-child(7n){border-right:0}.day.out{background:color-mix(in srgb,var(--panel2) 76%,transparent);color:var(--muted)}.day.today{background:linear-gradient(180deg,var(--today),var(--panel))}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.day-num{font-weight:900}.today .day-num{background:var(--accent);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center}.count{font-size:.76rem;color:var(--muted);font-weight:800}.event{display:block;width:100%;text-align:left;border-radius:11px;padding:6px 7px;margin:5px 0;border:1px solid color-mix(in srgb,var(--accent) 16%,var(--border));background:var(--pill);font-weight:800;font-size:.83rem;white-space:normal}.event.med{background:var(--med)}.event.shot{background:var(--shot)}.event.pause{background:var(--pause)}.event.check{background:var(--check)}.agenda{display:none;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:14px;box-shadow:var(--shadow)}.agenda-day{border-bottom:1px solid var(--border);padding:12px 2px}.agenda-day:last-child{border-bottom:0}.agenda-date{font-weight:950;color:var(--accent);text-transform:capitalize}.agenda-event{margin-top:8px;padding:11px 12px;border-radius:15px;background:var(--panel2);border:1px solid var(--border)}.agenda-title{font-size:1.05rem;font-weight:900}.desc{color:var(--muted);margin-top:4px;white-space:pre-wrap}.empty{padding:32px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:.86rem;margin-top:18px}.dialog{border:1px solid var(--border);border-radius:22px;background:var(--panel);color:var(--text);max-width:460px;box-shadow:var(--shadow)}.dialog::backdrop{background:#0016}.dialog h2{margin:0 0 6px}.dialog .close{float:right}@media(max-width:760px){main{padding:10px 8px 28px}.toolbar{grid-template-columns:1fr;position:static}.month-title{text-align:left;order:-1}.weekdays{display:none}.month-grid{display:block}.day{min-height:auto;border-right:0;padding:10px 12px}.day.out:empty{display:none}.day.out{display:none}.day:not(.has-events):not(.today){display:none}.event{font-size:.92rem}.calendar.week-mode .day:not(.week-visible){display:none}}@media(min-width:761px){.calendar.week-mode .day:not(.week-visible){display:none}.calendar.week-mode .month-grid{grid-template-columns:repeat(7,1fr)}.calendar.week-mode .day.week-visible{display:block}.agenda-mode .calendar{display:none}.agenda-mode .agenda{display:block}}@media(max-width:760px){.agenda-mode .calendar{display:none}.agenda-mode .agenda{display:block}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Halamın İlaçları</h1><div class="sub">Takvim görünümünde ilaç, iğne ve ara hatırlatmaları. İstanbul saatine göre.</div></div></header>
  <div class="notice">⚠️ Bu sayfa herkese açıktır. Linki bilen herkes programı görebilir; “gizli link” güvenlik değildir.</div>
  <section class="toolbar" aria-label="Takvim kontrolleri">
    <div class="nav"><button id="prev">‹ Önceki</button><button id="today">Bugün</button><button id="next">Sonraki ›</button></div>
    <div class="month-title" id="rangeTitle">Takvim</div>
    <div class="views"><button data-view="month" class="active">Ay</button><button data-view="week">Hafta</button><button data-view="agenda">Liste</button></div>
  </section>
  <div class="filters" aria-label="Etkinlik filtreleri"><button data-filter="all" class="active">Tümü</button><button data-filter="💊">💊 İlaç</button><button data-filter="💉">💉 İğne</button><button data-filter="⏸️">⏸️ Ara</button><button data-filter="✅">✅ Kontrol</button></div>
  <section class="calendar" id="calendar" aria-live="polite"><div class="weekdays" id="weekdays"></div><div class="month-grid" id="grid"></div></section>
  <section class="agenda" id="agenda" aria-live="polite"></section>
  <footer id="meta"></footer>
</main>
<dialog class="dialog" id="details"><button class="close" id="closeDialog">Kapat</button><div id="detailBody"></div></dialog>
<script>
const TZ='Europe/Istanbul';const monthFmt=new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric',timeZone:TZ});const dateFmt=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:TZ});const isoFmt=new Intl.DateTimeFormat('sv-SE',{timeZone:TZ});
let data={events:[]}, view='month', filter='all', cursor=startOfMonth(todayInTR());
const days=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];document.getElementById('weekdays').innerHTML=days.map(d=>`<div class="weekday">${d}</div>`).join('');
function todayInTR(){return new Date(isoFmt.format(new Date())+'T12:00:00+03:00')}function iso(d){return d.toISOString().slice(0,10)}function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1,12)}function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1,12)}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x}
function eventType(e){if(e.title.includes('💉'))return'shot';if(e.title.includes('⏸️'))return'pause';if(e.title.includes('✅'))return'check';return'med'}function filtered(){return data.events.filter(e=>filter==='all'||e.title.includes(filter)).sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'tr'))}function byDate(){return filtered().reduce((m,e)=>((m[e.date]??=[]).push(e),m),{})}
function title(){if(view==='month')return monthFmt.format(cursor);const start=monday(cursor),end=addDays(start,6);if(view==='week')return `${dateFmt.format(start)} – ${dateFmt.format(end)}`;return 'Yaklaşan kayıtlar'}
function render(){document.body.classList.toggle('agenda-mode',view==='agenda');const cal=document.getElementById('calendar');cal.classList.toggle('week-mode',view==='week');document.getElementById('rangeTitle').textContent=title();renderCalendar();renderAgenda();document.getElementById('meta').textContent=`Güncellendi: ${data.generatedAt||'bilinmiyor'} · Kaynak: ${data.sourceCalendar||'events.json'}`}
function renderCalendar(){const map=byDate(),grid=document.getElementById('grid');const first=startOfMonth(cursor),offset=(first.getDay()+6)%7,start=addDays(first,-offset),today=iso(todayInTR()),weekStart=monday(cursor),weekEnd=addDays(weekStart,6);let html='';for(let i=0;i<42;i++){const d=addDays(start,i),key=iso(d),items=map[key]||[],out=d.getMonth()!==cursor.getMonth(),weekVisible=d>=weekStart&&d<=weekEnd;html+=`<div class="day ${out?'out':''} ${key===today?'today':''} ${items.length?'has-events':''} ${weekVisible?'week-visible':''}"><div class="day-head"><span class="day-num">${d.getDate()}</span>${items.length?`<span class="count">${items.length} kayıt</span>`:''}</div>${items.map(e=>`<button class="event ${eventType(e)}" data-uid="${e.uid}" data-date="${e.date}">${e.title}</button>`).join('')}</div>`}grid.innerHTML=html;grid.querySelectorAll('.event').forEach(b=>b.onclick=()=>showDetail(b.dataset.uid,b.dataset.date))}
function renderAgenda(){const rows=filtered().filter(e=>view!=='agenda'||e.date>=iso(addDays(todayInTR(),-14))).slice(0,90);const groups=rows.reduce((m,e)=>((m[e.date]??=[]).push(e),m),{});const agenda=document.getElementById('agenda');agenda.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([date,items])=>`<article class="agenda-day"><div class="agenda-date">${dateFmt.format(new Date(date+'T12:00:00+03:00'))}</div>${items.map(e=>`<div class="agenda-event"><div class="agenda-title">${e.title}</div>${e.description?`<div class="desc">${e.description}</div>`:''}</div>`).join('')}</article>`).join(''):'<div class="empty">Gösterilecek kayıt yok, takvim bile boş boş bakıyor.</div>'}
function showDetail(uid,date){const e=data.events.find(x=>x.uid===uid&&x.date===date)||data.events.find(x=>x.uid===uid);document.getElementById('detailBody').innerHTML=`<h2>${e.title}</h2><div class="agenda-date">${dateFmt.format(new Date(e.date+'T12:00:00+03:00'))}</div>${e.description?`<p class="desc">${e.description}</p>`:''}`;document.getElementById('details').showModal()}
document.getElementById('closeDialog').onclick=()=>document.getElementById('details').close();document.getElementById('prev').onclick=()=>{cursor=view==='month'?addMonths(cursor,-1):addDays(cursor,-7);render()};document.getElementById('next').onclick=()=>{cursor=view==='month'?addMonths(cursor,1):addDays(cursor,7);render()};document.getElementById('today').onclick=()=>{cursor=startOfMonth(todayInTR());if(view==='week')cursor=todayInTR();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;if(view==='month')cursor=startOfMonth(cursor);render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
fetch('events.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{data=j;render()}).catch(()=>{document.getElementById('grid').innerHTML='<div class="empty">events.json yüklenemedi.</div>';document.getElementById('meta').textContent='events.json yüklenemedi.'});
</script>
</body>
</html>
