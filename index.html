<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Halamın İlaçları</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7fbfa;--card:#ffffff;--text:#12312d;--muted:#5f7470;--accent:#098578;--soft:#dff3ef;--warn:#fff1ce;--border:#d7e7e4;--past:#8aa09b} @media(prefers-color-scheme:dark){:root{--bg:#071613;--card:#10231f;--text:#ecfffb;--muted:#adc6c1;--soft:#143b35;--warn:#3b2f12;--border:#21443d;--past:#78908a}}
    *{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--soft));color:var(--text);min-height:100vh} main{max-width:980px;margin:0 auto;padding:24px 16px 48px} header{padding:18px 4px 14px} h1{margin:0;font-size:clamp(2rem,7vw,3.8rem);letter-spacing:-.05em}.sub{color:var(--muted);margin-top:6px}.notice{background:var(--warn);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin:12px 0 18px}.toolbar{align-items:center;display:flex;gap:10px;justify-content:space-between;margin:16px 0}.nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:750}button:hover{border-color:var(--accent)}#monthLabel{font-size:1.35rem;font-weight:850}.calendar{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 30px #0001;overflow:hidden}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{color:var(--muted);font-size:.82rem;font-weight:800;padding:12px;text-align:center;text-transform:uppercase}.day{border-top:1px solid var(--border);border-left:1px solid var(--border);min-height:118px;padding:10px}.day:nth-child(7n+1){border-left:0}.date{font-weight:850}.outside{color:var(--past);background:color-mix(in srgb,var(--soft) 34%,transparent)}.today{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px}.events{display:flex;flex-direction:column;gap:6px;margin-top:8px}.event{background:var(--soft);border:0;border-radius:12px;color:var(--text);cursor:pointer;font:inherit;font-size:.88rem;font-weight:750;line-height:1.25;padding:7px 8px;text-align:left;width:100%}.event:hover{background:color-mix(in srgb,var(--soft) 70%,var(--accent))}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{background:var(--card);border:1px solid var(--border);border-radius:22px;color:var(--text);max-width:460px;padding:0;width:calc(100% - 32px)}dialog::backdrop{background:#0008}.modal{padding:18px}.modal h2{margin:0 0 8px}.modal .when{color:var(--accent);font-weight:800}.modal p{color:var(--muted);white-space:pre-wrap}.modal button{margin-top:8px}footer{color:var(--muted);font-size:.86rem;margin-top:18px}@media(max-width:680px){main{padding:16px 10px 36px}.toolbar{align-items:flex-start;flex-direction:column}.weekdays div{font-size:.7rem;padding:8px 2px}.day{min-height:92px;padding:7px 5px}.event{font-size:.76rem;padding:6px}.date{font-size:.86rem}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Halamın İlaçları</h1>
    <div class="sub">Aylık ilaç ve iğne takvimi. İstanbul saatine göre.</div>
  </header>
  <section class="toolbar" aria-label="Takvim gezinme">
    <div id="monthLabel" aria-live="polite"></div>
    <div class="nav">
      <button id="prev" type="button">Önceki</button>
      <button id="today" type="button">Bugün</button>
      <button id="next" type="button">Sonraki</button>
    </div>
  </section>
  <section class="calendar" aria-label="Aylık takvim">
    <div class="weekdays"><div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </section>
  <footer id="meta"></footer>
</main>
<dialog id="detail"><div class="modal"><div class="when" id="detailDate"></div><h2 id="detailTitle"></h2><p id="detailDesc"></p><button id="close" type="button">Kapat</button></div></dialog>
<script>
const tz='Europe/Istanbul';
const dayFmt=new Intl.DateTimeFormat('tr-TR',{day:'numeric',timeZone:tz});
const monthFmt=new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric',timeZone:tz});
const fullFmt=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:tz});
const todayKey=new Intl.DateTimeFormat('sv-SE',{timeZone:tz}).format(new Date());
let visibleMonth=todayKey.slice(0,7);
let eventMap=new Map();
let allEvents=[];
function dateAtNoon(key){return new Date(key+'T12:00:00+03:00')}
function keyOf(date){return new Intl.DateTimeFormat('sv-SE',{timeZone:tz}).format(date)}
function addMonths(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+delta,1,12));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}
function openDetail(event){document.getElementById('detailDate').textContent=fullFmt.format(dateAtNoon(event.date));document.getElementById('detailTitle').textContent=event.title;document.getElementById('detailDesc').textContent=event.description||'';document.getElementById('detail').showModal()}
function render(){const [year,month]=visibleMonth.split('-').map(Number);const first=new Date(Date.UTC(year,month-1,1,12));const offset=(first.getUTCDay()+6)%7;const start=new Date(first);start.setUTCDate(first.getUTCDate()-offset);document.getElementById('monthLabel').textContent=monthFmt.format(first);const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const key=keyOf(d);const inMonth=key.slice(0,7)===visibleMonth;const events=eventMap.get(key)||[];cells.push(`<div class="day ${inMonth?'':'outside'} ${key===todayKey?'today':''}"><div class="date">${dayFmt.format(d)}</div><div class="events">${events.map((event,idx)=>`<button class="event" type="button" data-uid="${event.uid||key+'-'+idx}">${event.title}</button>`).join('')}</div></div>`)}document.getElementById('grid').innerHTML=cells.join('');document.querySelectorAll('.event').forEach(btn=>btn.addEventListener('click',()=>{const event=allEvents.find(e=>(e.uid||'')===btn.dataset.uid);if(event)openDetail(event)}))}
fetch('events.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{allEvents=data.events||[];eventMap=new Map();for(const event of allEvents){if(!eventMap.has(event.date))eventMap.set(event.date,[]);eventMap.get(event.date).push(event)}document.getElementById('meta').textContent=`Güncellendi: ${data.generatedAt} · Kaynak: ${data.sourceCalendar}`;render()}).catch(()=>{document.getElementById('grid').innerHTML='<div class="empty">events.json yüklenemedi.</div>'});
document.getElementById('prev').onclick=()=>{visibleMonth=addMonths(visibleMonth,-1);render()};
document.getElementById('next').onclick=()=>{visibleMonth=addMonths(visibleMonth,1);render()};
document.getElementById('today').onclick=()=>{visibleMonth=todayKey.slice(0,7);render()};
document.getElementById('close').onclick=()=>document.getElementById('detail').close();
</script>
</body>
</html>
