<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Halamın İlaçları</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7fbfa;--card:#ffffff;--text:#12312d;--muted:#5f7470;--accent:#098578;--soft:#dff3ef;--warn:#fff1ce;--border:#d7e7e4} @media(prefers-color-scheme:dark){:root{--bg:#071613;--card:#10231f;--text:#ecfffb;--muted:#adc6c1;--soft:#143b35;--warn:#3b2f12;--border:#21443d}}
    *{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--soft));color:var(--text);min-height:100vh} main{max-width:760px;margin:0 auto;padding:24px 16px 48px} header{padding:18px 4px 14px} h1{margin:0;font-size:clamp(2rem,7vw,3.8rem);letter-spacing:-.05em} .sub{color:var(--muted);margin-top:6px}.notice{background:var(--warn);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin:12px 0 18px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:700}button.active{background:var(--accent);color:white}.card{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--border);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0001}.date{font-weight:800;color:var(--accent);font-size:.92rem}.title{font-size:1.35rem;font-weight:850;margin-top:4px}.desc{color:var(--muted);margin-top:7px;white-space:pre-wrap}.today{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}.empty{padding:32px;text-align:center;color:var(--muted)} footer{color:var(--muted);font-size:.86rem;margin-top:26px}
  </style>
</head>
<body><main><header><h1>Halamın İlaçları</h1><div class="sub">Yaklaşan ilaç ve iğne hatırlatmaları. İstanbul saatine göre.</div></header><div class="notice">⚠️ Bu sayfa herkese açıktır. Linki bilen herkes programı görebilir; “gizli link” güvenlik değildir.</div><div class="controls"><button data-filter="all" class="active">Tümü</button><button data-filter="💊">💊 İlaç</button><button data-filter="💉">💉 İğne</button><button data-filter="⏸️">⏸️ Ara</button></div><section id="list" aria-live="polite"></section><footer id="meta"></footer></main><script>
const fmt=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Istanbul'});let current='all';
function isToday(d){const now=new Date(); return d===new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(now)}
function render(data){const list=document.getElementById('list'); const events=data.events.filter(e=>current==='all'||e.title.includes(current)).slice(0,60); list.innerHTML=events.length?events.map(e=>`<article class="card ${isToday(e.date)?'today':''}"><div class="date">${fmt.format(new Date(e.date+'T12:00:00+03:00'))}${isToday(e.date)?' · Bugün':''}</div><div class="title">${e.title}</div>${e.description?`<div class="desc">${e.description}</div>`:''}</article>`).join(''):'<div class="empty">Gösterilecek kayıt yok, metal yorgunluğu bile bundan daha heyecanlı.</div>'; document.getElementById('meta').textContent=`Güncellendi: ${data.generatedAt} · Kaynak: ${data.sourceCalendar}`}
fetch('events.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.filter;render(data)});render(data)}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">events.json yüklenemedi.</div>'});
</script></body></html>
